name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, dir: win_x64 }
          - { os: ubuntu-latest,  dir: lin_x64 }
          - { os: macos-latest,   dir: mac_x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download X-Plane SDK
        shell: bash
        run: |
          curl -L -o sdk.zip https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK411.zip
          unzip -q sdk.zip
          mv SDK SDK_tmp && mv SDK_tmp SDK
      - name: Configure & build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          mkdir -p out/ZiboCopilot/${{ matrix.dir }}
          find build -name "ZiboCopilot.xpl" -exec cp {} out/ZiboCopilot/${{ matrix.dir }}/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: ZiboCopilot-${{ matrix.dir }}
          path: out
